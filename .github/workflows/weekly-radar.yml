name: Weekly Travel Radar

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  weekly-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly radar
        run: python -m src.main weekly
